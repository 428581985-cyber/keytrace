<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgPaused" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#3F4756" />
    </linearGradient>
  </defs>

  <!-- Modern minimalist squircle base (muted slate when paused) -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#bgPaused)" />
  <rect x="17" y="17" width="222" height="222" rx="53" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2" />

  <!-- Negative-space geometric K mark -->
  <rect x="66" y="66" width="26" height="124" rx="13" fill="#E2E8F0" />
  <path d="M 178 79 L 122 128 L 178 177"
        fill="none"
        stroke="#E2E8F0"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>
