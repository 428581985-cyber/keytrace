name: 应用兼容性
description: 某个程序里采不到上屏文字或击键
labels: ["app-compat"]
body:
  - type: input
    id: app
    attributes:
      label: 应用与版本
      placeholder: 微信 4.0 / VS Code 1.96
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: 情况
      options:
        - 击键有，上屏文字没有
        - 击键和文字都没有
        - 文字有，但缺字或重复
        - 拼音和上屏对不上
    validations:
      required: true
  - type: input
    id: ime
    attributes:
      label: 输入法
      placeholder: 微软拼音（双拼/全拼）
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 补充
      description: 打一句中文时的实际情况
