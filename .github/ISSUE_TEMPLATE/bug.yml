name: Bug
description: 功能异常、崩溃、统计不对
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么，你期望是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: Windows 版本、输入法、keytrace --version
      placeholder: Win11 24H2 / 微软拼音 / 0.0.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 只贴相关片段，贴之前删掉个人信息
      render: text
